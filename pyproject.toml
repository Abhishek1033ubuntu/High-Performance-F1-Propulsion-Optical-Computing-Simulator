[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-propulsion-sim"
version = "4.0.0"
description = "Multi-physics propulsion, additive toolpath verifier, and sub-atomic material simulator for F1 powertrains."
authors = [{ name = "Abhishek Singh", email = "abhishek1033@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0"
]

[project.scripts]
f1-sim = "f1_propulsion_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
