name: F1 Propulsion Simulator CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib pyyaml pytest

    - name: Verify Dual-Mode Simulation Execution
      run: |
        python f1_v4_monza_simulation.py

    - name: Check Generated Telemetry Graphics Output
      run: |
        test -f f1_v4_monza_telemetry_simulation.png && echo "Telemetry Image Rendered Successfully"
